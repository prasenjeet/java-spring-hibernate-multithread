# ─── Datasource ───────────────────────────────────────────────────────────────
spring.datasource.url=jdbc:h2:mem:multithreaddb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ─── HikariCP Connection Pool ─────────────────────────────────────────────────
# Sized to support our demo threads without exhaustion
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.pool-name=HibernateMultiThreadPool

# ─── JPA / Hibernate ──────────────────────────────────────────────────────────
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.generate_statistics=false
# Disable Open-Session-In-View: prevents a request-scoped EntityManager from
# caching entities across multiple repository calls within the same HTTP request.
# Without this, findById() after concurrent updates returns the stale first-level
# cache value instead of the freshly-committed DB state.
spring.jpa.open-in-view=false

# ─── H2 Console (open http://localhost:8080/h2-console while running) ─────────
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
# Allow the H2 console to connect to the in-memory datasource from the browser
spring.h2.console.settings.web-allow-others=false

# ─── Logging ──────────────────────────────────────────────────────────────────
logging.level.com.example.hibernatemultithread=INFO
logging.level.org.springframework.transaction=WARN
logging.level.org.hibernate.SQL=WARN
